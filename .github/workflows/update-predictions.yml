name: Update predictions

on:
  schedule:
    - cron: "0 6 * * *"        # every day at 06:00 UTC (07:00 UK summer time)
  workflow_dispatch:            # "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths: ["docs/**"]          # republish if docs/ is updated by hand

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-predictions
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      API_FOOTBALL_MIN_INTERVAL: "0.25"  # paid plan (use 6.5 on the free plan)
      TZ: Europe/London
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-pipeline.txt

      - run: pip install -r requirements-pipeline.txt

      - name: Check API key is set
        run: |
          if [ -z "$API_FOOTBALL_KEY" ]; then
            echo "::error::Add your key as a repository secret named API_FOOTBALL_KEY (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - name: Download data and predict (all leagues)
        run: |
          set -o pipefail
          python -m pipeline.run 2>&1 | tee pipeline.log || {
            echo "::error title=Pipeline failed::$(tail -n 25 pipeline.log | tr '\n' '|' | cut -c1-3500)"
            exit 1
          }

      - name: Build website
        if: always()
        run: python build_site.py

      - name: Save new data to the repository
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset -q -- .env 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Daily prediction update $(date +%d-%m-%Y)"
            git pull --rebase -X theirs origin main || true
            git push
          fi

      - uses: actions/upload-pages-artifact@v3
        if: always()
        with:
          path: docs

  deploy:
    needs: update
    if: always() && needs.update.result != 'skipped'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  deploy-manual:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
