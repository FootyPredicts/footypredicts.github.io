name: Backfill injuries

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      API_FOOTBALL_MIN_INTERVAL: "0.25"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-pipeline.txt
      - run: pip install -r requirements-pipeline.txt
      - run: python -m pipeline.backfill_injuries 400
      - name: Save injury history
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add data/*/injuries_history.json
          git diff --cached --quiet || git commit -m "Add historical injury lists"
          git pull --rebase
          git push
