name: rl-probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        env:
          K: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          for i in 1 2 3; do
            curl -s -D - -o /tmp/b -H "x-apisports-key: $K" https://v3.football.api-sports.io/status | grep -i "ratelimit\|HTTP/" | tr -d '\r' | tr '\n' ' '
            echo; head -c 200 /tmp/b; echo; sleep 20
          done
