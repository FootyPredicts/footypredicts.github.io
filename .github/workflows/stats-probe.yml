name: stats-probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        env:
          K: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          H="x-apisports-key: $K"; B=https://v3.football.api-sports.io
          echo "== status"; curl -s -H "$H" $B/status | python3 -c "import sys,json;d=json.load(sys.stdin);r=d.get('response') or {};print(d.get('errors'),r.get('subscription'),r.get('requests'))"
          echo "== live fixtures"; curl -s -H "$H" "$B/fixtures?live=all" | python3 -c "
          import sys,json
          d=json.load(sys.stdin); print('errors',d.get('errors'),'results',d.get('results'))
          ids=[]
          for g in d.get('response',[]):
              if g['league']['id'] in (39,40,140,78,135,61): ids.append(g['fixture']['id']); print(g['fixture']['id'],g['league']['name'],g['teams']['home']['name'],g['fixture']['status']['elapsed'],'stats_in_fixture:',len(g.get('statistics') or []))
          open('/tmp/ids','w').write(' '.join(map(str,ids[:3])))
          "
          for i in $(cat /tmp/ids); do
            echo "== statistics fixture=$i"
            curl -s -H "$H" "$B/fixtures/statistics?fixture=$i" | python3 -c "
          import sys,json
          d=json.load(sys.stdin); print('errors',d.get('errors'),'results',d.get('results'),'paging',d.get('paging'))
          for t in d.get('response',[]): print(t['team']['name'],[(s['type'],s['value']) for s in t['statistics']][:8])
          "
            echo "== ids= bulk"; curl -s -H "$H" "$B/fixtures?ids=$i" | python3 -c "
          import sys,json
          d=json.load(sys.stdin); g=(d.get('response') or [{}])[0]; print('errors',d.get('errors'),'stats',len(g.get('statistics') or []),'events',len(g.get('events') or []),'status',(g.get('fixture') or {}).get('status'))
          "
          done
