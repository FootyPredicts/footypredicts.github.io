name: Matchday refresh

on:
  schedule:
    - cron: "7,37 9-21 * * *"   # every 30 minutes in the daytime: picks up confirmed line-ups and late injury news
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-predictions       # never write at the same time as the daily update
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONUNBUFFERED: "1"
      TZ: Europe/London
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-pipeline.txt
      - run: pip install -r requirements-pipeline.txt
      - name: Refresh injuries and predictions
        run: python -m pipeline.refresh
      - name: Rebuild the site
        run: python build_site.py
      - name: Save
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset -q -- .env 2>/dev/null || true
          if git diff --cached --quiet; then echo "No changes"; else
            git commit -m "Matchday refresh"
            git pull --rebase -X theirs origin main || true
            git push
          fi
