name: Pressure log

on:
  schedule:
    - cron: "0 11,13,15,17,19,21 * * *"   # each run watches live matches for about 2 hours
  workflow_dispatch:
    inputs:
      minutes:
        description: "How many minutes to watch"
        default: "20"

permissions:
  contents: write

concurrency:
  group: pressure-log
  cancel-in-progress: false

jobs:
  log:
    runs-on: ubuntu-latest
    timeout-minutes: 135
    env:
      PYTHONUNBUFFERED: "1"
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      API_FOOTBALL_MIN_INTERVAL: "0.25"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-pipeline.txt
      - run: pip install -r requirements-pipeline.txt
      - name: Watch live matches and log high-pressure flags
        run: python -m pipeline.pressure_log "${{ github.event.inputs.minutes || '115' }}"
      - name: Save the log
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pressure_log.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "No changes"; else
            git commit -m "Pressure log update"
            for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; sleep 5; done
          fi
