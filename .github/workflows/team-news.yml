name: Team news

on:
  schedule:
    - cron: "40 8,12,16,20 * * *"   # a few times a day
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-predictions       # never write at the same time as the daily update
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: "1"
      TZ: Europe/London
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-pipeline.txt
      - run: pip install -r requirements-pipeline.txt
      - name: Fetch headlines
        run: python -m pipeline.news
      - name: Rebuild the site
        run: python build_site.py
      - name: Save
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset -q -- .env 2>/dev/null || true
          if git diff --cached --quiet; then echo "No changes"; else
            git commit -m "Team news update"
            git pull --rebase -X theirs origin main || true
            git push
          fi
